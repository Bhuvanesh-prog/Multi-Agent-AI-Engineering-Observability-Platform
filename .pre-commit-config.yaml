# Fast local checks before every commit. CI runs the full gate (.github/workflows/security-gate.yml).
# Install once:  pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^deploy/.*/templates/
      - id: check-json
        exclude: ^(orbit-ui/(tsconfig.*|\.vscode/.*)\.json|local/servicebus/Config\.json)$
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: \.(docx|ico|png)$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        files: ^agent-runtime/
      - id: ruff-format
        files: ^agent-runtime/
